name: Discord commando's registreren

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Registreer AFR artikelcommando's in Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: "1549311819879948330"
          DISCORD_GUILD_ID: "1549312932914012231"
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::Repository secret DISCORD_BOT_TOKEN ontbreekt."
            exit 1
          fi

          cat > commands.json <<'JSON'
          [
            {
              "name": "artikel-toevoegen",
              "description": "Voeg veilig een nieuw artikel toe aan de AFR-regels",
              "type": 1,
              "dm_permission": false,
              "options": [
                {
                  "name": "pagina",
                  "description": "Kies op welke pagina het artikel moet komen",
                  "type": 3,
                  "required": true,
                  "choices": [
                    {
                      "name": "Home",
                      "value": "home"
                    },
                    {
                      "name": "Informatie",
                      "value": "informatie"
                    },
                    {
                      "name": "APV",
                      "value": "apv"
                    },
                    {
                      "name": "Wetboek AFR",
                      "value": "wetboek"
                    },
                    {
                      "name": "Onderwereld",
                      "value": "onderwereld"
                    },
                    {
                      "name": "Hulpdiensten",
                      "value": "hulpdiensten"
                    },
                    {
                      "name": "Risicogebieden",
                      "value": "risico"
                    },
                    {
                      "name": "Wijzigingen",
                      "value": "wijzigingen"
                    }
                  ]
                }
              ]
            },
            {
              "name": "artikel-verwijderen",
              "description": "Verwijder als owner een artikel via een veilige keuzelijst",
              "type": 1,
              "dm_permission": false,
              "options": [
                {
                  "name": "pagina",
                  "description": "Kies de pagina waarvan je een artikel wilt verwijderen",
                  "type": 3,
                  "required": true,
                  "choices": [
                    {
                      "name": "Home",
                      "value": "home"
                    },
                    {
                      "name": "Informatie",
                      "value": "informatie"
                    },
                    {
                      "name": "APV",
                      "value": "apv"
                    },
                    {
                      "name": "Wetboek AFR",
                      "value": "wetboek"
                    },
                    {
                      "name": "Onderwereld",
                      "value": "onderwereld"
                    },
                    {
                      "name": "Hulpdiensten",
                      "value": "hulpdiensten"
                    },
                    {
                      "name": "Risicogebieden",
                      "value": "risico"
                    },
                    {
                      "name": "Wijzigingen",
                      "value": "wijzigingen"
                    }
                  ]
                }
              ]
            }
          ]
          JSON

          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request PUT \
              --header "Authorization: Bot $DISCORD_BOT_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @commands.json \
              "https://discord.com/api/v10/applications/$DISCORD_APPLICATION_ID/guilds/$DISCORD_GUILD_ID/commands"
          )"

          cat "$response_file"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Discord gaf HTTP $status terug."
            exit 1
          fi

          echo "Discord-commando's succesvol geregistreerd."
