  <script>
    const pages={
      home:{nav:'Home',title:'Welkom bij AmersfoortRolePlay',intro:'Alles wat je nodig hebt om prettig en eerlijk te roleplayen vind je op deze website.',sections:[['Starten op de server','Lees voor je begint de Algemene Plaatselijke Verordening en het wetboek. Zo weet je precies wat er van je wordt verwacht.'],['Belangrijke onderdelen','<div class="cards"><a class="card" href="#apv"><span class="badge">REGELS</span><h3>Algemene Plaatselijke Verordening</h3><p>De algemene server- en roleplayregels.</p></a><a class="card" href="#wetboek"><span class="badge">WETBOEK</span><h3>Wetboek AFR</h3><p>Strafbare feiten en bijbehorende richtlijnen.</p></a><a class="card" href="#onderwereld"><span class="badge">ONDERWERELD</span><h3>Onderwereld Regels</h3><p>Regels voor criminele groeperingen.</p></a><a class="card" href="#hulpdiensten"><span class="badge">DIENSTEN</span><h3>Hulpdiensten Regels</h3><p>Afspraken voor officiële diensten.</p></a></div>'],['Hulp nodig?','Kom je er niet uit? Neem dan contact op met een stafflid via de officiële supportkanalen.']]},
      informatie:{nav:'Informatie',title:'Informatie',intro:'Praktische informatie over onze roleplayserver en community.',sections:[['Over AmersfoortRolePlay','AmersfoortRolePlay is een Nederlandse roleplaycommunity waarin realistisch, respectvol en creatief samenspel centraal staat.'],['Aan de slag','Maak een passend personage, lees de regels en sluit aan bij bestaande scenario’s. Geef andere spelers altijd ruimte om op jouw acties te reageren.'],['Support','Gebruik bij vragen of problemen een supportticket. Vermeld duidelijk wat er gebeurde en voeg waar mogelijk bewijs toe.']]},
      apv:{nav:'Algemene Plaatselijke Verordening',title:'Algemene Plaatselijke Verordening Amersfoort',meta:[['Organisatie','Hoge Raad Amersfoort'],['Officiële naam regeling','Algemene Plaatselijke Verordening Amersfoort'],['Vastgesteld door','Hoge Raad Amersfoort']],note:'De categorieën zijn richtlijnen. Staff kan op basis van context en eerdere overtredingen een passende andere straf bepalen. Door de server te betreden accepteer je de actuele regels.',sections:[
        ['Wetstechnische informatie','De APV vult het Nederlandse recht en het Wetboek AFR aan en vormt het kader voor maatregelen binnen en buiten roleplay.'],
        ['Algemene Bepalingen',''],['A1 - Reikwijdte','De APV geldt voor het eiland, de gemeente, de stad en de bijbehorende communityplatformen.'],['A2 - Geldigheid','De gunstigste toepasselijke bepaling wordt gebruikt; betrokken staffleden behandelen geen eigen zaken en eerlijkheid tegenover staff is verplicht.'],['A3 - Strafbepaling','Maatregelen lopen op van waarschuwingen met taken tot een tijdelijke of permanente ban. Context, herhaling en het ontwijken van straffen wegen mee.'],['A4 - Aanvullende Wetten en regels','Het Wetboek AFR en aanvullend Nederlands recht blijven van toepassing voor onderwerpen die hier niet volledig zijn geregeld.'],
        ['Overtredingen - Verstoring openbare orde (RP)',''],['Artikel 1 - FailRP / Powergaming','Onrealistische roleplay, gedwongen uitkomsten en acties zonder reactieruimte zijn niet toegestaan.'],['Artikel 2 - Cheats','Software, aangepaste clients, packs of instellingen die oneerlijk voordeel geven zijn verboden.'],['Artikel 3 - Exploits','Het bewust benutten van bugs, animaties, kleding of systemen voor voordeel is verboden.'],['Artikel 4 - Verstoring RP','Het moedwillig verstoren van scenario’s van andere spelers is niet toegestaan.'],['Artikel 5 - Meta-gaming','Informatie van buiten je personage mag niet in roleplay worden gebruikt; in-game communicatie moet ook in-game hoorbaar zijn.'],['Artikel 6 - Beroepskleding','Tijdens een beroep draag je de daarvoor verstrekte en voorgeschreven kleding.'],['Artikel 7 - Baiting','Het zonder serieus motief uitlokken of bezighouden van politie, staff of groeperingen is verboden.'],['Artikel 8 - Spam','Overmatige herhaling van berichten, geluiden of acties is niet toegestaan.'],['Artikel 9.1 - Combat-logging','Een actief scenario verlaten of uitloggen om gevolgen of verlies te ontwijken is verboden.'],['Artikel 9.2 - Combat-stashen','Gebruikte of buitgemaakte wapens mogen niet direct tijdens of kort na een scenario worden opgeborgen.'],['Artikel 10 - GTAV Driving style','Rijd realistisch, gebruik geschikte voertuigen voor terrein en respecteer de limieten bij achtervolgingen en pits.'],['Artikel 11 - Value of Life','Bescherm het leven van je personage en werk mee bij een geloofwaardige, directe dreiging.'],['Artikel 12 – Microfoon / stemvervormer','Een werkende, verstaanbare microfoon is verplicht; stemvervorming is alleen toegestaan binnen vastgestelde uitzonderingen.'],['Artikel 13 - Nederlandse Taal','Nederlands en Engels zijn de toegestane voertalen; andere talen mogen niet provocerend of beledigend worden ingezet.'],['Artikel 14 - Reporting','Gebruik reports voor actuele problemen en tickets voor uitgebreide zaken; misbruik van het systeem is verboden.'],['Artikel 15 - Karakter breken (OOC)','Blijf tijdens een scenario in karakter en bespreek regels of staffzaken niet midden in de roleplay.'],['Artikel 16 - Alt Characters','Houd personages, kennis, eigendommen en criminele belangen strikt van elkaar gescheiden.'],['Artikel 17 - Voertuigen in gebouwen','Voertuigen horen niet in gebouwen tenzij de locatie en het scenario dit realistisch toelaten.'],['Artikel 18 - Standaard-outfit','Zorg voor een herkenbare, aangeklede personage-outfit en vermijd standaard- of glitchkleding.'],['Artikel 19 - Impersonatie overheidsmedewerker','Jezelf zonder bevoegdheid voordoen als overheidsmedewerker of stafflid is verboden.'],['Artikel 20 - GreenZone','In veilige zones start je geen geweld, ontvoering, beroving of andere criminele scenario’s.'],
        ['Overtredingen - Schade des persoons',''],['Artikel 21 - VDM','Een voertuig als wapen gebruiken zonder geldige roleplayopbouw is verboden.'],['Artikel 22.1 - RDM (Crimineel)','Iemand zonder voldoende aanleiding, opbouw en waarschuwing verwonden of doden is verboden.'],['Artikel 22.2 - RDM (Politie / KMar)','Overheidsdiensten gebruiken geweld proportioneel en pas wanneer de situatie dit rechtvaardigt.'],['Artikel 23 – Belediging van spelers of staff','Ernstige persoonlijke beledigingen, discriminatie en doelgerichte intimidatie worden niet geaccepteerd.'],
        ['Overtredingen - Criminele activiteiten',''],['Artikel 24 - Scammen','Oplichting is alleen toegestaan binnen de expliciet beschreven grenzen en nooit via misbruik van systemen.'],['Artikel 24.1 – Overvallen & Oplichting','Overvallen moeten realistische voorbereiding, geldige deelnemers en passende inzet van goederen hebben.'],['Artikel 25 - Ontsnappen uit het cellencomplex','Ontsnappen vereist een geloofwaardig scenario en mag geen technische fouten of onrealistische routes benutten.'],['Artikel 26 - Stemherkenning','Stemmen mogen alleen worden herkend wanneer het scenario daarvoor voldoende aanleiding biedt.'],['Artikel 27 - Streamsniping','Livestreams gebruiken om spelers, locaties of plannen te achterhalen is verboden.'],['Artikel 28 - Jobhoppen','Wissel niet onrealistisch snel van baan om voordeel, uitrusting of informatie te verkrijgen.'],['Artikel 29 - Appartementen','Appartementen en opslag mogen niet worden misbruikt om actieve scenario’s te ontlopen.'],['Artikel 30 - Twitter','De in-game sociale media blijven in-character en bevatten geen spam, persoonsgegevens of ongepaste inhoud.'],['Artikel 31 - Ambulance','Ambulancemedewerkers en medische roleplay worden gerespecteerd; hun neutraliteit mag niet worden misbruikt.'],['Artikel 32 – Algemene regels hulpdiensten','Dienstbevoegdheden, voertuigen, systemen en informatie zijn uitsluitend bedoeld voor legitiem dienstgebruik.'],['Artikel 33 – Voordoen als staff','Het nabootsen van staff, bevoegdheden of officiële mededelingen is verboden.'],['Artikel 34 – New Life Rule','Na definitief overlijden vervalt de herinnering aan de directe aanleiding en betrokkenen van het afgesloten scenario.'],['Artikel 35 – Kloten','Doelloos hinderen, trollen en gedrag zonder roleplaywaarde is niet toegestaan.'],['Artikel 36 – Campen','Langdurig op één locatie wachten om spelers zonder scenario-opbouw te onderscheppen is verboden.'],['Artikel 37 – Schieten vanuit een voertuig','Drive-by schieten en voertuigvuur zijn alleen toegestaan binnen de vastgestelde uitzonderingen en scenario-eisen.'],['Artikel 38 – IRL Trading','In-game geld, goederen of diensten verhandelen voor echt geld of externe voordelen is verboden.'],['Artikel 39 - Bonus','Bonussen, acties en beloningen mogen niet worden uitgebuit of via alternatieve accounts worden gestapeld.'],['Artikel 40 - Discord','Officiële Discordkanalen vallen onder dezelfde gedragsnormen; externe kanalen geven geen uitzondering op serverregels.'],['Artikel 41 - Ontvoeren overheidsmedewerker','Ontvoering van een overheidsmedewerker vereist zwaarwegende roleplayopbouw en mag niet voor systeemmisbruik dienen.'],['Artikel 42 - ANWB','ANWB-medewerkers blijven neutraal en worden niet misbruikt voor criminele toegang of tactisch voordeel.'],['Artikel 43 - No Fly Zone','Vliegende voertuigen respecteren de aangewezen verboden zones en aanwijzingen van bevoegde diensten.'],['Artikel 44 - Refunds','Een vergoeding vereist aantoonbaar bewijs en wordt alleen via de officiële procedure behandeld.'],['Artikel 47 - Helikopters & vliegtuigen','Bestuurders vliegen realistisch, landen op geschikte locaties en respecteren luchtruim en veiligheidsregels.'],['Artikel 48 – Toxic gedrag','Pesten, treiteren, provoceren en een aanhoudend vijandige houding tegenover spelers of staff is verboden.'],['Artikel 49 – Vliegende voertuigen','Onrealistisch, gevaarlijk of hinderlijk gebruik van luchtvaartuigen is niet toegestaan.'],['Artikel 50 – Bodylooten','Goederen van bewusteloze of overleden spelers meenemen mag alleen wanneer de regels en het scenario dit uitdrukkelijk toestaan.']
      ]},
      wetboek:{nav:'Wetboek AFR',title:'Wetboek AmersfoortRolePlay',meta:[['Organisatie','Openbaar Ministerie Amersfoort'],['Officiële naam regeling','Wetboek van Strafrecht AFR'],['Status','Actief']],note:'De genoemde straffen zijn uitgangspunten. Politie en justitie wegen de omstandigheden van iedere zaak mee.',sections:[['Titel I - Algemene bepalingen',''],['Artikel 1 - Poging en medeplichtigheid','Een aantoonbare poging tot een strafbaar feit of bewuste hulp daarbij kan eveneens worden bestraft.'],['Titel II - Verkeer',''],['Artikel 2 - Gevaarlijk rijgedrag','Roekeloos rijgedrag, straatraces en het bewust veroorzaken van gevaar zijn strafbaar.'],['Artikel 3 - Vluchten voor politie','Het niet opvolgen van een stopteken en de daaropvolgende vlucht vormen een zelfstandig strafbaar feit.'],['Titel III - Vermogensdelicten',''],['Artikel 4 - Diefstal','Het zonder toestemming wegnemen van andermans eigendom is verboden.'],['Artikel 5 - Overval','Diefstal onder bedreiging of geweld geldt als overval en wordt zwaarder bestraft.']]},
      onderwereld:{nav:'Onderwereld Regels',title:'Onderwereld Regels',note:'Criminele roleplay moet voor alle betrokkenen een geloofwaardig en speelbaar scenario opleveren.',sections:[['Groeperingen','Officiële groeperingen houden zich aan de afgesproken ledenlimiet en herkenbaarheid. Samenwerking mag niet worden gebruikt om limieten te omzeilen.'],['Overvallen','Een overval moet een duidelijk roleplaymotief hebben. Geef slachtoffers en hulpdiensten voldoende tijd en ruimte om te reageren.'],['Ontvoeringen','Ontvoeren zonder scenario-opbouw of uitsluitend voor financieel gewin is niet toegestaan. Het welzijn van alle deelnemers staat voorop.'],['Wapengebruik','Wapens zijn een laatste middel. Het tonen of gebruiken ervan vereist een passende aanleiding en duidelijke escalatie.'],['Gebieden','Op aangewezen veilige locaties mogen geen criminele handelingen worden gestart of voortgezet.']]},
      hulpdiensten:{nav:'Hulpdiensten Regels',title:'Hulpdiensten Regels',note:'Als hulpdienst vertegenwoordig je een officiële organisatie. Professioneel en dienstbaar optreden is daarom verplicht.',sections:[['Algemene houding','Blijf professioneel, communiceer duidelijk en handel proportioneel. Misbruik van dienstmiddelen of bevoegdheden is verboden.'],['Politie','Agenten volgen de commandostructuur, gebruiken passend geweld en bieden verdachten een eerlijk en speelbaar scenario.'],['Ambulance','Medisch personeel blijft neutraal, beoordeelt letsel zorgvuldig en deelt geen vertrouwelijke informatie.'],['Brandweer','Brandweermedewerkers zorgen voor een veilige afzetting en werken samen met andere aanwezige diensten.'],['Uit dienst','Dienstmiddelen, voertuigen, kleding en informatie mogen niet voor privédoeleinden worden gebruikt.']]},
      risico:{nav:'Risicogebieden',title:'Risicogebieden',intro:'In deze gebieden gelden aanvullende risico’s en regels.',sections:[['Wat is een risicogebied?','Een risicogebied is een gemarkeerde locatie waar de kans op criminele confrontaties groter is. Betreden gebeurt op eigen risico, maar alle algemene roleplayregels blijven gelden.'],['Gedragsregels','Schieten zonder aanleiding, terugkeren na overlijden en het opwachten bij de grens van het gebied blijven verboden.'],['Hulpdiensten','Hulpdiensten betreden een actief risicogebied alleen met voldoende ondersteuning en een duidelijk operationeel doel.']]}
    };
    const order=['home','informatie','apv','wetboek','onderwereld','hulpdiensten','risico'];

    const slug=()=>location.hash.slice(1)||'home';
    const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    function render(){const key=pages[slug()]?slug():'home',p=pages[key];document.querySelector('.nav').innerHTML=order.map(k=>`<a href="#${k}" class="${k===key?'active':''}">${pages[k].nav}</a>`).join('')+'<a href="https://amersfoortroleplay.nl" target="_blank" rel="noopener">Main website</a>';document.querySelector('.side').innerHTML=`<a href="#${key}">${p.nav}</a>`;let out=`<h1>${p.title}</h1>`;if(p.intro)out+=`<p>${p.intro}</p>`;if(p.meta)out+=`<section class="meta">${p.meta.map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</section>`;if(p.note)out+=`<aside class="note"><strong>LET OP</strong><p>${p.note}</p></aside>`;out+=p.sections.map((s,i)=>{const group=i===0||!s[1],tag=group?'h2':'h3';return `<${tag} id="s${i}">${s[0]}</${tag}>${s[1]?s[1].startsWith('<')?s[1]:`<p>${s[1]}</p>`:''}`}).join('');document.querySelector('#content').innerHTML=out;document.querySelector('#tocLinks').innerHTML=p.sections.map((s,i)=>`<a class="${i===0||!s[1]?'':'sub'}" href="#s${i}">${s[0]}</a>`).join('');document.title=`${p.nav} — AmersfoortRolePlay`;window.scrollTo(0,0);document.querySelector('.nav').classList.remove('open')}
    const categoryMarkup=s=>String(s).replace(/Categorie\s+(10|[1-9])\b/gi,(m,n)=>`<button type="button" class="category-jump" data-category="${n}">${m}</button>`);
    function prepareCategoryLinks(key){
      if(key!=='apv')return;
      const root=document.querySelector('#content');
      root.querySelectorAll('li strong').forEach(strong=>{const match=strong.textContent.trim().match(/^Categorie\s+(10|[1-9])$/i);if(match)strong.closest('li').id=`categorie-${match[1]}`});
      root.querySelectorAll('table td').forEach(cell=>{if(!cell.querySelector('.category-jump')&&/Categorie\s+(10|[1-9])\b/i.test(cell.textContent))cell.innerHTML=categoryMarkup(cell.innerHTML)});
    }
    const contentEl=document.querySelector('#content');
    new MutationObserver(()=>{contentEl.querySelectorAll('h3').forEach(h=>{const value=penalties[h.textContent.trim()];if(value&&!h.nextElementSibling?.classList.contains('penalty')){const box=document.createElement('div');box.className='penalty';box.innerHTML=`<strong>Straf</strong><span>${categoryMarkup(value)}</span>`;h.insertAdjacentElement('afterend',box)}})}).observe(contentEl,{childList:true});
    window.addEventListener('hashchange',render);document.querySelector('.hamb').addEventListener('click',()=>document.querySelector('.nav').classList.toggle('open'));
    document.querySelector('#tocLinks').addEventListener('click',e=>{const link=e.target.closest('a');if(!link)return;e.preventDefault();const target=document.querySelector(link.getAttribute('href'));if(target)target.scrollIntoView({behavior:'smooth',block:'start'})});
    document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),box=document.querySelector('#searchResults');if(q.length<2){box.classList.remove('open');return}const hits=[];for(const [k,p] of Object.entries(pages)){if((p.title+' '+(p.intro||'')+' '+p.sections.flat().join(' ')).toLowerCase().includes(q))hits.push(`<a href="#${k}"><strong>${p.nav}</strong><br><small>${p.title}</small></a>`)}box.innerHTML=hits.join('')||'<div class="empty">Geen resultaten gevonden</div>';box.classList.add('open')});document.addEventListener('click',e=>{if(!e.target.closest('.searchbox')&&!e.target.closest('.search-results'))document.querySelector('#searchResults').classList.remove('open')});render();
  </script>
  <style>
    .category-jump{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.article li[id^="categorie-"]{scroll-margin-top:165px}.category-target-flash{animation:categoryFlash 1.4s ease}@keyframes categoryFlash{0%,45%{background:#dce8ff}100%{background:transparent}}
    .article ol,.article ul{font-size:17px;padding-left:28px;margin:8px 0 22px}.article li{margin:7px 0}.article table{width:100%;border-collapse:collapse;margin:18px 0 34px;font-size:16px}.article th,.article td{border:1px solid var(--line);padding:12px 15px;text-align:left;vertical-align:top}.article th{background:#f5f6fa;font-weight:700}.article hr{border:0;border-top:1px solid var(--line);margin:46px 0}.article blockquote{margin:25px 0;padding:8px 20px;border-left:4px solid var(--accent);background:var(--note)}.article code{background:#f1f2f4;padding:2px 5px;border-radius:3px}.article img{max-width:100%;height:auto}.loading{color:#777;padding:24px 0}
  </style>
  <script>
    const fullSources={home:'index.md',informatie:'informatie.md',apv:'apv.md',wetboek:'wetboek.md',onderwereld:'onderwereldregels.md',hulpdiensten:'hulpdienstenregels.md',risico:'risicogebieden.md'};
    const sourceCache={};
    const cleanMd=s=>s.replace(/\*\*/g,'').replace(/__/g,'').replace(/`/g,'').trim();
    const slugMd=s=>cleanMd(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    function inlineMd(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
    function markdownMd(md){const source=md.replace(/\r/g,'').replace(/^---\s*\n[\s\S]*?\n---\s*(?:\n|$)/,'').replace(/<\/?br\s*\/?>/gi,'');const lines=source.split('\n'),out=[],heads=[];let i=0,list='';const close=()=>{if(list){out.push(`</${list}>`);list=''}};while(i<lines.length){const raw=lines[i],t=raw.trim();if(!t){close();i++;continue}const hm=t.match(/^(#{1,6})\s+(.+)$/);if(hm){close();const level=Math.min(3,hm[1].length),title=cleanMd(hm[2]),id=slugMd(title)||`deel-${i}`;heads.push({level,title,id});out.push(`<h${level} id="${id}">${inlineMd(hm[2])}</h${level}>`);i++;continue}if(/^\|.*\|$/.test(t)&&i+1<lines.length&&/^\|?[\s:|-]+\|?$/.test(lines[i+1].trim())){close();const rows=[];rows.push(t);i+=2;while(i<lines.length&&/^\|.*\|$/.test(lines[i].trim()))rows.push(lines[i++].trim());out.push('<table><tbody>'+rows.map((r,ri)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>`<${ri?'td':'th'}>${inlineMd(c.trim())}</${ri?'td':'th'}>`).join('')+'</tr>').join('')+'</tbody></table>');continue}if(/^---+$|^\*\*\*+$/.test(t)){close();out.push('<hr>');i++;continue}if(/^!!!\s+/.test(t)){close();const label=t.replace(/^!!!\s+\w+\s*/, '').replace(/^"|"$/g,'')||'LET OP';i++;const body=[];while(i<lines.length&&(lines[i].startsWith('    ')||!lines[i].trim())){if(lines[i].trim())body.push(lines[i].trim());i++}out.push(`<aside class="note"><strong>${inlineMd(label)}</strong><p>${inlineMd(body.join(' '))}</p></aside>`);continue}const li=t.match(/^(\d+\.|[-*])\s+(.+)$/);if(li){const want=/\d+\./.test(li[1])?'ol':'ul';if(list!==want){close();list=want;out.push(`<${list}>`)}out.push(`<li>${inlineMd(li[2])}</li>`);i++;continue}if(t.startsWith('>')){close();out.push(`<blockquote>${inlineMd(t.replace(/^>\s?/,''))}</blockquote>`);i++;continue}close();const para=[t];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6})\s|^\|.*\|$|^(\d+\.|[-*])\s+|^!!!\s+|^---+$|^\*\*\*+$/.test(lines[i].trim()))para.push(lines[i++].trim());out.push(`<p>${inlineMd(para.join(' '))}</p>`)}close();return{html:out.join(''),heads}}
    async function renderFull(){const key=fullSources[location.hash.slice(1)]?location.hash.slice(1):'home';document.querySelector('#content').innerHTML='<p class="loading">Regels laden…</p>';try{const md=sourceCache[key]||(sourceCache[key]=await fetch(`content/${fullSources[key]}`).then(r=>{if(!r.ok)throw Error();return r.text()}));if(key!==((location.hash.slice(1)||'home')))return;const parsed=markdownMd(md);document.querySelector('#content').innerHTML=parsed.html;prepareCategoryLinks(key);document.querySelector('#tocLinks').innerHTML=parsed.heads.filter(h=>h.level<=3).map(h=>`<a class="${h.level>=3?'sub':''}" href="#${h.id}">${h.title}</a>`).join('');document.querySelector('.side').innerHTML=`<a href="#${key}">${pages[key].nav}</a>`;document.title=`${pages[key].nav} — AmersfoortRolePlay`}catch(e){document.querySelector('#content').innerHTML='<p>De volledige regels konden niet worden geladen. Probeer de pagina opnieuw.</p>'}}
    contentEl.addEventListener('click',e=>{const button=e.target.closest('.category-jump');if(!button)return;const target=document.querySelector(`#categorie-${button.dataset.category}`)||document.querySelector('#a3-strafbepaling');if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.classList.remove('category-target-flash');void target.offsetWidth;target.classList.add('category-target-flash')}});
    window.addEventListener('hashchange',renderFull);renderFull();
  </script>
